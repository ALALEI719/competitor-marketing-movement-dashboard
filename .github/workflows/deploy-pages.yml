name: Deploy Dashboard Mirror

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4

      - name: Refresh committed public files from Vercel when reachable
        shell: bash
        run: |
          base="https://competitor-marketing-movement-track.vercel.app"
          mkdir -p site/data/evidence/screenshots site/data/edm-details
          fetch_file() {
            source_path="$1"
            destination="$2"
            temporary="${destination}.download"
            if curl --fail --silent --show-error --location --retry 2 --max-time 30 "${base}/${source_path}" --output "${temporary}"; then
              mv "${temporary}" "${destination}"
            else
              rm -f "${temporary}"
              echo "Using committed fallback for ${source_path}."
            fi
          }
          fetch_file "index.html" "site/index.html"
          fetch_file "app.js" "site/app.js"
          fetch_file "website-review.js" "site/website-review.js"
          fetch_file "action-date.js" "site/action-date.js"
          fetch_file "ads-observations.js" "site/ads-observations.js"
          fetch_file "dashboard-v3.js" "site/dashboard-v3.js"
          fetch_file "dashboard-v3.css" "site/dashboard-v3.css"
          fetch_file "data/campaign-calendar.json" "site/data/campaign-calendar.json"
          fetch_file "styles.css" "site/styles.css"
          fetch_file "styles-rules.css" "site/styles-rules.css"
          fetch_file "styles-edm.css" "site/styles-edm.css"
          # The three review files are refreshed as one freshness-checked snapshot below.
          fetch_file "data/site-observations.json" "site/data/site-observations.json"
          # A heartbeat can publish mirror data before Vercel finishes deploying it.
          # Keep the newer validated export instead of overwriting it with an older primary.
          if curl --fail --silent --show-error --max-time 30 "${base}/data/ads-observations.json" --output site/data/ads-observations.download; then
            incoming=$(jq -r '.generatedAt // ""' site/data/ads-observations.download)
            existing=$(jq -r '.generatedAt // ""' site/data/ads-observations.json 2>/dev/null || true)
            if jq -e '.targetId == "meta-mammotion-us" and .schemaVersion == "1.0" and (.records | type == "array")' site/data/ads-observations.download >/dev/null && [[ -n "$incoming" && ( "$incoming" > "$existing" || "$incoming" == "$existing" ) ]]; then
              mv site/data/ads-observations.download site/data/ads-observations.json
            fi
          fi
          rm -f site/data/ads-observations.download
          mirror_snapshot_directory="$(mktemp -d)"
          mirror_snapshot_ready=true
          for mirror_snapshot_name in formal-actions marketing-events monitor-summary; do
            if ! curl --fail --silent --show-error --max-time 30 "${base}/data/${mirror_snapshot_name}.json" --output "${mirror_snapshot_directory}/${mirror_snapshot_name}.json"; then
              mirror_snapshot_ready=false
            fi
          done
          if [ "$mirror_snapshot_ready" = true ]; then
            python3 ops/refresh-review-snapshot.py "$mirror_snapshot_directory" site/data
          else
            echo "Keeping validated committed review snapshot; primary is unreachable."
          fi
          rm -rf "$mirror_snapshot_directory"
          fetch_file "data/evidence/index.json" "site/data/evidence/index.json"
          fetch_file "data/edm-details/index.json" "site/data/edm-details/index.json"
          if [ -f site/data/evidence/index.json ]; then
            jq -r '.entries[].captures[] | .viewportScreenshot, .keyRegionScreenshot, .previousViewportScreenshot' site/data/evidence/index.json | sed '/^$/d' | sort -u | while read -r asset; do
              mkdir -p "site/$(dirname "${asset}")"
              fetch_file "${asset}" "site/${asset}"
            done
          fi
          if [ -f site/data/edm-details/index.json ]; then
            jq -r '.items[].detailRef' site/data/edm-details/index.json | while read -r detail; do
              if [[ ! "$detail" =~ ^\./data/edm-details/EDM-[A-Z0-9]+\.json$ ]]; then
                echo "Skipping invalid EDM detail path: ${detail}"
                continue
              fi
              detail_path="${detail#./}"
              fetch_file "$detail_path" "site/$detail_path"
              if [ ! -f "site/$detail_path" ]; then
                continue
              fi
              jq -r '.images[].src' "site/$detail_path" | while read -r asset; do
                if [[ ! "$asset" =~ ^\./data/edm-assets/EDM-[A-Z0-9]+/image-[0-9][0-9]\.(png|jpg|jpeg|gif|webp|avif)$ ]]; then
                  echo "Skipping invalid EDM image path: ${asset}"
                  continue
                fi
                asset_path="${asset#./}"
                mkdir -p "site/$(dirname "$asset_path")"
                fetch_file "$asset_path" "site/$asset_path"
              done
            done
          fi

      - name: Keep assets compatible with the Pages subdirectory
        run: |
          sed -i 's|href="/styles.css"|href="./styles.css"|g' site/index.html
          sed -i 's|href="/styles-rules.css"|href="./styles-rules.css"|g' site/index.html
          sed -i 's|href="/styles-edm.css"|href="./styles-edm.css"|g' site/index.html
          sed -i 's|src="/app.js"|src="./app.js"|g' site/index.html
          sed -i "s|fetch('/data/monitor-summary.json'|fetch('./data/monitor-summary.json'|g" site/app.js

      - name: Save refreshed public fallback when changed
        run: |
          if git diff --quiet -- site; then
            echo "Public fallback is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site
            git commit -m "Refresh public dashboard snapshot"
            git push
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R site/. _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
